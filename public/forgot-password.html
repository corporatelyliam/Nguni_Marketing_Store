<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Nguni Marketing</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>

<div class="topbar">
  <span>Windhoek · Swakopmund · Walvis Bay · Oshakati · nationwide OOH coverage</span>
  <span>nguninamibia@gmail.com &nbsp;|&nbsp; +264 81 300 1748</span>
</div>

<header>
  <div class="header-inner">
    <div class="logo">
      <img src="images/logo.png" alt="Nguni Marketing logo">
      <div>NGUNI<span class="sub">Marketing</span></div>
    </div>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="contact.html">Contact</a>
      <a href="shop.html">Shop</a>
      <span id="accountNavSlot"></span>
    </nav>
    <div class="header-actions">
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </div>
</header>

<div class="store-wrap">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your account email and we'll send you a link to choose a new password.</p>
    <div id="alertBox"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;" id="submitBtn">Send reset link</button>
    </form>
    <p class="switch"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div>
      <div class="logo" style="color:#fff;margin-bottom:14px;">
        <img src="images/logo.png" alt="Nguni Marketing logo">
        <div>NGUNI <span class="sub" style="color:#D8CBAF;">Marketing</span></div>
      </div>
    </div>
  </div>
</footer>

<script src="js/site.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="/js/pages/forgot-password.js"></script>
</body>
</html>
